# Trigger SRE Agent investigation when a production issue is reported
name: SRE Agent - Investigate Issue

on:
  issues:
    types: [opened]

jobs:
  investigate:
    runs-on: ubuntu-latest

    steps:
      - name: Call SRE Agent HTTP Trigger
        env:
          SRE_TRIGGER_URL: ${{ secrets.SRE_TRIGGER_URL }}
          ARM_TOKEN: ${{ secrets.ARM_TOKEN }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_URL: ${{ github.event.issue.html_url }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          REPO: ${{ github.repository }}
        run: |
          PAYLOAD=$(jq -n \
            --arg source "github" \
            --arg issue_title "$ISSUE_TITLE" \
            --argjson issue_number "$ISSUE_NUMBER" \
            --arg issue_url "$ISSUE_URL" \
            --arg issue_body "$ISSUE_BODY" \
            --arg repo "$REPO" \
            '{
              source: $source,
              issue_title: $issue_title,
              issue_number: $issue_number,
              issue_url: $issue_url,
              issue_body: $issue_body,
              repo: $repo
            }')

          RESPONSE=$(curl -s -w "\n%{http_code}" -X POST "$SRE_TRIGGER_URL" \
            -H "Authorization: Bearer ${ARM_TOKEN}" \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD")

          HTTP_CODE=$(echo "$RESPONSE" | tail -1)
          BODY=$(echo "$RESPONSE" | head -n -1)

          echo "Response: $BODY"
          echo "HTTP Status: $HTTP_CODE"

          if [ "$HTTP_CODE" != "202" ] && [ "$HTTP_CODE" != "200" ]; then
            echo "::error::SRE Agent trigger failed with HTTP $HTTP_CODE"
            exit 1
          fi

          echo "::notice::SRE Agent investigation triggered successfully"
