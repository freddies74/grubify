name: grubify
metadata:
  template: grubify-food-delivery@0.0.1-beta

services:
  api:
    project: ./GrubifyApi
    language: dotnet
    host: containerapp

  frontend:
    project: ./grubify-frontend
    language: js
    host: containerapp

hooks:
  postdeploy:
    shell: pwsh
    run: |
      echo "🍕 Grubify Food Delivery App deployed successfully!"
      echo "Frontend URL: $env:FRONTEND_URL"
      echo "API URL: $env:API_BASE_URL"
      if ($env:API_WORKLOAD_IDENTITY_ENABLED -eq "true") {
        echo "🔐 Validating API workload identity federated credential..."
        & ./scripts/validate-federated-credential.ps1 `
          -ResourceGroupName $env:AZURE_RESOURCE_GROUP `
          -IdentityName $env:API_MANAGED_IDENTITY_NAME `
          -CredentialName $env:API_WORKLOAD_IDENTITY_CREDENTIAL_NAME `
          -ExpectedIssuer $env:API_WORKLOAD_IDENTITY_ISSUER `
          -ExpectedSubject $env:API_WORKLOAD_IDENTITY_SUBJECT
      }
